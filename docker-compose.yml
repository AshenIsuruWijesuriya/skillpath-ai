services:
  db:
    image: pgvector/pgvector:pg17        # official Postgres 17 + pgvector
    environment:
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: skillpath       # local only; real secrets go in hosting dashboards
      POSTGRES_DB: skillpath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpath"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

volumes:
  pgdata: